<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대표작 카드 (샘플)</title>
<style>
  body { margin: 0; font-family: -apple-system, "Noto Sans KR", sans-serif; background: #f5f5f5; color: #222; }

  /* ===== 대표작 칸 시작 (기존 대표작 영역과 교체) ===== */
  .featured { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
  .featured h2 { margin: 0 0 16px; font-size: 1.25rem; }
  .featured-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .fcard { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .fcard-media { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  .fcard-media button, .fcard-media iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; padding: 0; }
  .fcard-media button { cursor: pointer; background: #000; }
  .fcard-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .fcard-play { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px;
    border-radius: 50%; background: rgba(0,0,0,.65); }
  .fcard-play::after { content: ""; position: absolute; left: 22px; top: 16px;
    border-left: 18px solid #fff; border-top: 12px solid transparent; border-bottom: 12px solid transparent; }
  .fcard-media button:hover .fcard-play, .fcard-media button:focus-visible .fcard-play { background: rgba(0,0,0,.85); }
  .fcard-body { padding: 12px 14px 16px; }
  .fcard-title { margin: 0 0 4px; font-size: 1rem; font-weight: 700; }
  .fcard-desc { margin: 0; font-size: .9rem; color: #555; line-height: 1.45; }
  .fcard-empty { display: flex; align-items: center; justify-content: center; color: #999; background: #e8e8e8; }
  /* ===== 대표작 칸 끝 ===== */
</style>
</head>
<body>

<section class="featured" id="featured">
  <h2>대표작</h2>
  <div class="featured-grid" id="featuredGrid"></div>
</section>

<script>
  // ▼ 영상 정보는 여기만 수정하세요. 추가하려면 { } 한 줄을 더 넣으면 됩니다.
  const FEATURED = [
    { url: "https://youtu.be/PtcmXWxl3Jw", title: "선교특집 1편 알래스카 윤호용 선교사", desc: "선교특집" },
    { url: "https://youtu.be/9shmNhQM9Nw", title: "2026 교회홍보", desc: "YFGC 홍보" }
  ];

  // 유튜브 주소(watch, youtu.be, shorts, embed)에서 영상 ID 추출
  function getYouTubeId(url) {
    const m = String(url).match(/(?:youtu\.be\/|v=|\/shorts\/|\/embed\/)([A-Za-z0-9_-]{11})/);
    return m ? m[1] : null;
  }

  const grid = document.getElementById("featuredGrid");

  FEATURED.forEach(function (item) {
    const id = getYouTubeId(item.url);
    const card = document.createElement("article");
    card.className = "fcard";

    const media = document.createElement("div");
    media.className = "fcard-media";

    if (id) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.setAttribute("aria-label", item.title + " 재생");
      const img = document.createElement("img");
      img.src = "https://i.ytimg.com/vi/" + id + "/hqdefault.jpg";
      img.alt = item.title;
      img.loading = "lazy";
      const play = document.createElement("span");
      play.className = "fcard-play";
      btn.append(img, play);
      btn.addEventListener("click", function () {
        const iframe = document.createElement("iframe");
        iframe.src = "https://www.youtube-nocookie.com/embed/" + id + "?autoplay=1&rel=0";
        iframe.title = item.title;
        iframe.allow = "accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen";
        iframe.allowFullscreen = true;
        media.replaceChildren(iframe);
      });
      media.appendChild(btn);
    } else {
      media.classList.add("fcard-empty");
      media.textContent = "영상 준비중";
    }

    const body = document.createElement("div");
    body.className = "fcard-body";
    const t = document.createElement("h3");
    t.className = "fcard-title";
    t.textContent = item.title;
    const d = document.createElement("p");
    d.className = "fcard-desc";
    d.textContent = item.desc;
    body.append(t, d);

    card.append(media, body);
    grid.appendChild(card);
  });
</script>
</body>
</html>
